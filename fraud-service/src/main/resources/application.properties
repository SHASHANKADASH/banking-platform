spring.application.name=fraud-service
server.port=8082
# replace localhost with service name when running with docker
spring.datasource.url=jdbc:postgresql://postgres:5432/payments
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
logging.file.path=logs
logging.file.name=/app/logs/payment-service.log
logging.pattern.console="%d [%thread] [%X{trace_id:-},%X{span_id:-}] %-5level %logger - %msg%n"
logging.pattern.file="%d [%thread] [%X{trace_id:-},%X{span_id:-}] %-5level %logger - %msg%n"