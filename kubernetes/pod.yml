apiVersion: v1
kind: Pod
metadata:
  name: postgres-service
  labels:
    app: postgres-service
    environment: local
spec:
  containers:
    - name: postgres
      image: postgres:16
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_DB
          value: "payments"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "trust"