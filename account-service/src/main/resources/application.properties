spring.application.name=account-service
server.port=8080
# replace localhost with service name when running with docker
spring.datasource.url=jdbc:postgresql://postgres:5432/payments
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
logging.file.path=logs
logging.file.name=/app/logs/account-service.log
# These properties were required when we were logging correlationId manually using MDC. But OTEL already does that for us.
# logging.pattern.console="%d [%thread] [%X{correlationId}] %-5level %logger - %msg%n"
# logging.pattern.file="%d [%thread] [%X{correlationId}] %-5level %logger - %msg%n"
logging.pattern.console="%d [%thread] [%X{trace_id:-},%X{span_id:-}] %-5level %logger - %msg%n"
logging.pattern.file="%d [%thread] [%X{trace_id:-},%X{span_id:-}] %-5level %logger - %msg%n"